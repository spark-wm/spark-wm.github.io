<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SparkWM: Audio-Video World Model</title>
    <meta name="description" content="SparkWM is an audio-video world model post-trained from MiniMax H3 33B. It generates video and sound chunk by chunk, in 4 denoising steps per chunk." />
    <meta name="theme-color" content="#0A0A0B" />
    <!-- Link previews need absolute URLs. -->
    <link rel="canonical" href="https://spark-wm.github.io/" />
    <meta property="og:site_name" content="SparkWM" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spark-wm.github.io/" />
    <meta property="og:title" content="SparkWM: Audio-Video World Model" />
    <meta property="og:description" content="An audio-video world model post-trained from MiniMax H3 33B that generates video and sound chunk by chunk, in 4 denoising steps per chunk." />
    <meta property="og:image" content="https://spark-wm.github.io/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SparkWM wordmark next to a frame generated by SparkWM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="sparkwm-icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      try {
        var s = localStorage.getItem('sparkwm-theme');
        document.documentElement.dataset.theme = s === 'light' ? 'light' : 'dark';
        var l = localStorage.getItem('sparkwm-lang') || ((navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
